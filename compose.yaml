services:
  headscale:
    image: ghcr.io/juanfont/headscale:0.29.3
    restart: unless-stopped
    command: serve
    volumes:
      - ./config/headscale/config.yaml:/etc/headscale/config.yaml:ro
      - headscale-data:/var/lib/headscale
      - headscale-run:/var/run/headscale
    expose:
      - "8080"
      - "9090"
    ports:
      - "3478:3478/udp"
    networks:
      - tailstor
    labels:
      - me.tale.headplane.target=headscale
    healthcheck:
      test: ["CMD", "headscale", "health"]
      interval: 30s
      timeout: 5s
      retries: 5

  headplane:
    image: ghcr.io/tale/headplane:0.7.1
    restart: unless-stopped
    profiles: ["ui"]
    depends_on:
      headscale:
        condition: service_healthy
    volumes:
      - ./config/headplane/config.yaml:/etc/headplane/config.yaml:ro
      - ./config/headscale/config.yaml:/etc/headscale/config.yaml:ro
      - headplane-data:/var/lib/headplane
    expose:
      - "3000"
    networks:
      - tailstor

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      headscale:
        condition: service_healthy
    environment:
      TAILSTOR_DOMAIN: ${TAILSTOR_DOMAIN}
      TAILSTOR_ADMIN_DOMAIN: ${TAILSTOR_ADMIN_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - tailstor

networks:
  tailstor:
    driver: bridge

volumes:
  headscale-data:
  headscale-run:
  headplane-data:
  caddy-data:
  caddy-config:
